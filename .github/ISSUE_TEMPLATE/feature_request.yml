name: 功能建议
description: 新的阅读体验、格式支持或交互改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么
      description: 描述现在的困扰，而不是直接给方案
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的做法
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 试过的替代方案（可选）
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: 与项目定位的冲突自查
      options:
        - label: 不引入账号、遥测或远程代码
        - label: 不需要上架商店就能用
